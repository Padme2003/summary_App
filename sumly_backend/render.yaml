services:
  - type: web
    name: sumly-backend
    env: docker
    dockerfilePath: ./sumly_backend/Dockerfile
    dockerContext: ./sumly_backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
